name: Deploy landing

# Two things make the landing go stale, so both trigger a deploy.
#
#   1. A new release. The page reads the version from GitHub's latest release
#      at BUILD time, so the number only changes when the site is rebuilt. This
#      fires on `published`, after the release exists — building any earlier
#      would pick up the previous version and advertise a download that is one
#      release behind the button beside it.
#   2. A change to landing/ on main. Copy edits used to need a manual deploy,
#      which is the same trap one level up: the repo says one thing and the
#      live site says another until someone remembers.
#
# Secret required (Settings → Secrets and variables → Actions):
#   FIREBASE_SERVICE_ACCOUNT — the JSON key of a service account with the
#   "Firebase Hosting Admin" role on the notex-b95a8 project.

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - 'landing/**'
      - '.github/workflows/deploy-landing.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A release and a landing edit can land within seconds of each other. Only
  # the newer deploy is worth finishing.
  group: deploy-landing
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: landing/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check the version was actually resolved
        # The build falls back to omitting the version when the GitHub API is
        # unreachable, which is right for a reader but wrong to ship silently
        # from a release deploy — that is the one deploy whose whole purpose is
        # the new number.
        if: github.event_name == 'release'
        run: |
          expected="${GITHUB_REF_NAME#v}"
          if ! grep -q "v${expected}" dist/index.html; then
            echo "::error::Built landing does not mention v${expected} — the release lookup failed."
            exit 1
          fi
          echo "Landing reports v${expected}."

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: notex-b95a8
          channelId: live
          entryPoint: landing
